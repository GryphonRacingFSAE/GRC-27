[platformio]
; `pio run` builds the firmware only; host tests run with `pio test -e native`.
default_envs = esp32-s3-devboard

[dyno]
; Warnings are errors for our own code only (not the Arduino/ESP-IDF framework).
strict_flags =
   -Wall
   -Wextra
   -Werror

[env:esp32-s3-devboard]

platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 2000000
monitor_speed = 115200
debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug

lib_deps =
   bogde/HX711@0.7.5

build_flags =
   -DBOARD_HAS_PSRAM
   -DARDUINO_USB_CDC_ON_BOOT=1
   -I include/Tasks
   -I include/Defines
   -I include/Utils

build_src_flags =
   ${dyno.strict_flags}

; Host tests: hardware-free logic, run on the dev machine (no hardware needed).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
   -std=gnu++17
   -I include/Defines
   ${dyno.strict_flags}
   -fsanitize=address,undefined
   -fno-sanitize-recover=all
   -fno-omit-frame-pointer

; Same firmware, but the load cell is a scripted fake (ramp + a 3 s "unplug"
; every 30 s), for checking the pipeline on a bare devkit with no HX711.
;   pio run -e esp32-s3-fake -t upload && pio device monitor
[env:esp32-s3-fake]
extends = env:esp32-s3-devboard
build_flags =
   ${env:esp32-s3-devboard.build_flags}
   -DDYNO_FAKE_INPUTS=1
